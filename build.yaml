# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# NOTE: DYA Studio 対応 (cormoran/zmk main+dya, Zephyr 4.1) でボード名が
#       `seeeduino_xiao_ble` から `xiao_ble/nrf52840/zmk` に変わっている。
---
include:
  # 右手 (central)。トラックボールセンサーは PAW3222
  - board: xiao_ble/nrf52840/zmk
    shield: mona2_r rgbled_adapter
    snippet: studio-rpc-usb-uart
    # Zephyr は devicetree を Kconfig より先に処理するため、センサーの切り替えは paw3222.overlay で行う
    cmake-args: '-DEXTRA_CONF_FILE=../../config/paw3222.conf -DEXTRA_DTC_OVERLAY_FILE=../../config/paw3222.overlay'
    artifact-name: mona2_r
  - board: xiao_ble/nrf52840/zmk
    shield: mona2_l rgbled_adapter
    artifact-name: mona2_l
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset
